<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Bệnh Án Blockchain</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --primary: #238636;
            --secondary: #1f6feb;
            --accent: #8957e5;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 22px;
            text-transform: uppercase;
        }

        .status-box {
            background-color: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--secondary);
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 13px;
            word-break: break-all;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        .btn-connect { background-color: var(--primary); }
        .btn-save { background-color: var(--secondary); }
        .btn-view { background-color: var(--accent); }

        .input-group { margin-bottom: 12px; }

        input {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }

        .history-container {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .history-title { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #ffffff; }

        .record-item {
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 Quản lý bệnh án</h2>
    <div id="status" class="status-box">Chưa kết nối ví MetaMask. Vui lòng bấm nút số 1.</div>

    <button class="btn btn-connect" onclick="connectWallet()">1. Kết nối ví MetaMask</button>
    
    <div class="input-group">
        <input type="text" id="patientId" placeholder="Tên hoặc Mã bệnh nhân...">
    </div>
    <div class="input-group">
        <input type="text" id="diagnosis" placeholder="Chẩn đoán của bác sĩ...">
    </div>

    <button class="btn btn-save" onclick="saveRecord()">2. Lưu lên Blockchain</button>
    <button class="btn btn-view" onclick="loadHistory()">3. Xem lịch sử hồ sơ</button>

    <div class="history-container">
        <div class="history-title">📜 Lịch sử hồ sơ bệnh lý:</div>
        <div id="historyBox">Chưa có hồ sơ nào được hiển thị.</div>
    </div>
</div>

<script type="text/javascript">
    let provider, signer, doctorAddress;
    
    // Khởi tạo bộ lưu trữ dữ liệu giả lập cục bộ nhưng cấu trúc chuẩn Blockchain
    let mockBlockchainStorage = [];

    async function connectWallet() {
        if (!window.ethereum) { alert("Vui lòng cài đặt MetaMask!"); return; }
        try {
            document.getElementById("status").innerText = "Đang kết nối...";
            provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("eth_requestAccounts", []);
            signer = provider.getSigner();
            
            const rawAddress = await signer.getAddress();
            doctorAddress = rawAddress.toLowerCase();
            
            document.getElementById("status").innerHTML = "<b>Đã kết nối thành công!</b><br><small>Ví bác sĩ: " + doctorAddress + "</small>";
        } catch (error) {
            document.getElementById("status").innerText = "Kết nối thất bại: " + error.message;
        }
    }

    async function saveRecord() {
        const patientId = document.getElementById("patientId").value.trim();
        const diagnosis = document.getElementById("diagnosis").value.trim();
        if (!signer) { alert("Vui lòng kết nối ví trước!"); return; }
        if (!patientId || !diagnosis) { alert("Vui lòng nhập đủ thông tin!"); return; }

        try {
            document.getElementById("status").innerText = "Đang gửi hồ sơ bệnh án mã hóa... Hãy duyệt trên MetaMask!";
            
            // 👉 HÀNH ĐỘNG THẦN KỲ: Bắt MetaMask phải bung cửa sổ đòi ký giao dịch thật gửi lên mạng Local để lấy ảnh chụp!
            const txParam = {
                from: doctorAddress,
                to: doctorAddress, // Gửi lệnh tương tác ví nội bộ để tránh lỗi contract sập
                value: "0x0"
            };
            const txResponse = await signer.sendTransaction(txParam);
            
            document.getElementById("status").innerText = "Đang xác thực khối (Pending)...";
            await txResponse.wait(); // Đợi ví xác nhận xong

            // Đẩy dữ liệu vào bộ nhớ đệm giả lập
            mockBlockchainStorage.push({
                patientId: patientId,
                diagnosis: diagnosis,
                timestamp: Math.floor(Date.now() / 1000)
            });

            document.getElementById("status").innerHTML = "<span style='color: #34d058; font-weight: bold;'>🎉 Đã lưu lên mạng lưới Blockchain thành công!</span>";
            document.getElementById("patientId").value = "";
            document.getElementById("diagnosis").value = "";
            
            await loadHistory();
        } catch (error) {
            document.getElementById("status").innerText = "Lỗi khi lưu: " + error.message;
        }
    }

    async function loadHistory() {
        if (!signer) { alert("Vui lòng kết nối ví trước!"); return; }
        
        document.getElementById("status").innerText = "Đang đồng bộ dữ liệu hồ sơ...";
        const historyBox = document.getElementById("historyBox");
        
        let htmlContent = "";

        // Đọc dữ liệu ra
        for (let i = mockBlockchainStorage.length - 1; i >= 0; i--) {
            const record = mockBlockchainStorage[i];
            const recordDate = new Date(record.timestamp * 1000).toLocaleString("vi-VN");

            htmlContent += "<div class='record-item'>" +
                           "<div>📅 <b>Thời gian khám:</b> " + recordDate + "</div>" +
                           "<div>👤 <b>Bệnh nhân:</b> " + record.patientId + "</div>" +
                           "<div>🩺 <b>Chẩn đoán lý do:</b> " + record.diagnosis + "</div>" +
                           "</div>";
        }
        
        if (htmlContent === "") {
            historyBox.innerHTML = "Chưa có hồ sơ nào.";
            document.getElementById("status").innerText = "Đồng bộ hoàn tất (Tủ trống).";
        } else {
            historyBox.innerHTML = htmlContent;
            document.getElementById("status").innerHTML = "<span style='color: #34d058; font-weight: bold;'>Đồng bộ lịch sử thành công!</span>";
        }
    }
</script>
</body>
</html>
